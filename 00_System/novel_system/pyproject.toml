[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-system"
version = "0.1.0"
description = "超长篇小说个人知识库与受控 AI 写作工作流（MVP）"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.scripts]
novel = "novel_system.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 不使用 --basetemp 固定到项目内：basetemp 若落在 Vault 里，
# 测试复制 Vault 时会把临时目录一起复制（无限递归），
# 且部分沙箱环境会拦截 .novel_system 下文件的删除导致全部用例 setup 失败。
# 需要指定时用：pytest tests -q --basetemp=/tmp/nv_pytest
