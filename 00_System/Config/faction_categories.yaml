# 势力「类别」白名单
#
# 为什么需要它
# ------------
# 势力卡的 `势力所属` 一栏是从旧表格沿用的，一栏装了两件事：
#
#     宗门,中立             ← 纯类别，不指向任何档案
#     贵族,帝室             ← 类别 + 真实上级
#     帝室                  ← 纯上级
#
# 关系引擎按「这个名字有没有对应档案」来分辨两者——解析得到就是上级，
# 解析不到就当类别丢掉。这办法在今天是准的，但它有个隐患：
# **一旦有人建了一张名叫「宗门」或「叛军」的势力卡，那些原本只是类别词的
# 卡片就会凭空多出一个上级**，而且不会有任何报错。
#
# 所以把类别词显式列在这里。`novel integrity` 会做两件事：
#   1. 类别词与势力同名 → MAJOR（层级会被静默算错）
#   2. `势力所属` 里既不是类别、也解析不到势力 → MINOR（多半是笔误或势力改过名）
#
# 新增类别时加一行即可；这只是词表，不是设定，改它不影响任何档案内容。

categories:
  # 组织形态
  - 宗门
  - 门阀
  - 贵族
  - 皇族
  - 官署
  - 行会
  - 商帮
  - 海商
  - 工坊
  - 社团
  - 帮派
  - 青楼
  - 书院
  # 「联盟」是形态而非立场：几家平等势力结成的联合体（长流系四阀即此类），
  # 与「盟友」字段不同——盟友是关系，联盟是它自己就是一张势力卡。
  - 联盟

  # 立场：身份，不是关系
  # 「中立」在旧势力表 `势力所属` 那一栏里本来就标着（平民、散人、百草、唐门、
  # 幽灵山庄、十巫山门、魇罗殿、凰天、赤水，共九张）。它说的是「这家不站队」，
  # 不需要对端，也不产生关系边；与本轮的 `中立` 关系字段（甲与乙之间表态中立）
  # 是两件事，别混成一个。
  # 列在这里的唯一原因：它必须被认成类别词，否则 `势力所属：宗门,中立` 会去找
  # 一张名叫「中立」的势力卡，找不到就报悬空。
  - 中立

  # 阵营 / 族属
  # 注意：「帝室」「环之教派」既是类别说法、也各有一张势力卡（FAC-0001 / FAC-0025），
  # 所以不列在这里——列进来就会把合法层级误报成撞名。类别词一旦立档成为势力，
  # 就该从本表移出，以势力卡为准。
  - 邪派
  - 侠义道
  - 叛军
  - 妖族
  - 羽族
  - 龙族
  - 异族
  - 海外

  # 学派 / 教派
  - 仁理学派
  - 工匠学派
  - 长生学派
  - 轮回教派
