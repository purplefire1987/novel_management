# Agent 注册表：角色、Prompt、可读路径、可写区域、可用工具（PRD 9.1）
version: 1

agents:
  chief_editor:
    name: 总编 Agent
    prompt: 00_System/Prompts/chief_editor.md
    read:
      - 01_Core_Memory/**
      - 02_Hot_Memory/**
      - 03_Short_Term_Memory/**
      - 04_Outline/**
      - 05_Story_Assets/**
      - 06_Plot_Ledger/**
      - 07_Entity_Graph/**
      - 08_Manuscripts/**
      - 09_Audit_Reports/**
    write:
      - 09_Audit_Reports/**        # 仅报告
    can_propose_canon_change: true
    can_write_formal_canon: false

  lore_keeper:
    name: 资料官 Agent
    prompt: 00_System/Prompts/lore_keeper.md
    read:
      - 01_Core_Memory/**
      - 02_Hot_Memory/**
      - 03_Short_Term_Memory/**
      - 04_Outline/**
      - 06_Plot_Ledger/**
      - 07_Entity_Graph/**
      - 08_Manuscripts/**
    write: []                      # 只读
    can_propose_canon_change: false
    can_write_formal_canon: false

  story_editor:
    name: 编辑 Agent
    prompt: 00_System/Prompts/story_editor.md
    read:
      - 01_Core_Memory/**
      - 02_Hot_Memory/**
      - 04_Outline/**
      - 06_Plot_Ledger/**
      - 07_Entity_Graph/**
    write:
      - .novel_system/staging/outline/**   # 仅提案区
    can_propose_canon_change: true
    can_write_formal_canon: false

  writer:
    name: 主笔 Agent
    prompt: 00_System/Prompts/writer.md
    read:
      - .novel_system/staging/preflight/** # 只读批准的 Preflight Pack
      - 04_Outline/**
      - 05_Story_Assets/**
      - 03_Short_Term_Memory/Style_Reference/**
    write:
      - .novel_system/staging/draft/**     # 仅草稿区
    can_propose_canon_change: false
    can_write_formal_canon: false

  memory_manager:
    name: 记忆管理员 Agent
    prompt: 00_System/Prompts/memory_manager.md
    read:
      - 08_Manuscripts/**
      - 01_Core_Memory/**
      - 02_Hot_Memory/**
      - 06_Plot_Ledger/**
      - 07_Entity_Graph/**
    write:
      - .novel_system/staging/memory/**     # 仅提案区
    can_propose_canon_change: true
    can_write_formal_canon: false

  intake_clerk:
    name: 录入员 Agent
    prompt: 00_System/Prompts/intake_clerk.md
    read:
      - 99_Archive/**
      - 01_Core_Memory/**          # 需要查已有实体 ID，避免造 ID
      - 02_Hot_Memory/**
      - 04_Outline/**
      - 07_Entity_Graph/**
      - 08_Manuscripts/**
      - 10_Change_Log/**
    write:
      - 09_Audit_Reports/**        # 录入回执与问题清单
    # 正式写入只能经 CLI 通道：
    #   novel ingest / novel annotate        —— 稿件（章节正文）
    #   novel import-assets / import-lore    —— 素材（资产库 / 设定稿）
    # 这些命令以 author 身份走事务（校验/备份/审计/Git 一并完成）
    write_channels:
      - "novel ingest"
      - "novel annotate"
      - "novel import-assets"
      - "novel import-lore"
    can_propose_canon_change: false
    can_write_formal_canon: false

  version_steward:
    name: 版本管理员 Agent
    prompt: 00_System/Prompts/version_steward.md
    read:
      - 10_Change_Log/**
      - 09_Audit_Reports/**
      - .novel_system/logs/**
    write:
      - 09_Audit_Reports/**        # 版本体检报告
    write_channels:
      - "novel snapshot"
      - "novel rollback"
      - "git tag"
    can_propose_canon_change: false
    can_write_formal_canon: false
    forbidden:
      - "git push --force"
      - "git reset --hard"
      - "改写已推送历史"
      - "删除分支"

  dice_maiden:
    name: 骰子娘 Agent
    prompt: 00_System/Prompts/dice_maiden.md
    role: 玩家共同见证的随机数生成器
    read:
      - 01_Core_Memory/World/九州/规则书/**   # 裁决依据
      - 01_Core_Memory/World/九州/总表/**     # 境界 / 挑战等级
      - 01_Core_Memory/Characters/**          # 取人物境界、等级（只读取值，不改写）
      - 02_Hot_Memory/**                      # 当前场景上下文
      - 06_Plot_Ledger/**                     # 台账历史（只追加）
    write:
      - 06_Plot_Ledger/Dice/**                # 只写掷骰台账
      - 09_Audit_Reports/**                   # 可写裁决回执
    write_channels:
      - "novel dice"
    can_propose_canon_change: false
    can_write_formal_canon: false
    forbidden:
      - "无见证值却声称玩家共同见证"
      - "改写或删除已落账的掷骰记录"
      - "私自下调 / 上调 DC，或把大成功、大失败降级"
      - "因剧情需要重掷而不留记录"
      - "口述或心算骰值（必须经 novel dice）"

