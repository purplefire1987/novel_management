# 公共默认配置。不得写入作者绝对路径、私人项目名或私人数据。
system:
  config_version: 1

author:
  author_id: "author-local"

paths:
  # 留空表示"由更高级配置或运行时推导"，不在本文件写死。
  public_repo: ""
  author_vault: ""
  runtime: ""

active_project:
  project_id: ""

privacy:
  private_remote_allowed: false
  public_repo_may_read_vault: false
  cross_project_access: false
  agent_canon_write: false

# Vault 与项目内使用的标准目录名。改这里等于改布局，必须同时更新 templates 与测试。
layout:
  vault_system_dir: "00_System"
  projects_dir: "10_Projects"
  shared_assets_dir: "90_Shared_Assets"
  vault_archive_dir: "99_Archive"
  project_subdirs:
    - "00_Project"
    - "01_Canon"
    - "02_Planning"
    - "03_Manuscripts"
    - "04_Story_Assets"
    - "05_Ledgers"
    - "06_Memory"
    - "07_Staging"
    - "08_Reviews"
    - "90_Archive"
  canon_subdirs:
    - "World"
    - "Characters"
    - "Locations"
    - "Organizations"
    - "Systems"
    - "Rules"
  runtime_subdirs:
    - "cache"
    - "index"
    - "logs"
    - "staging"
    - "temp"
