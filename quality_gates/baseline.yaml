# 质量门

统一规则，各工作流可另行追加更严的条件。

```yaml
id: baseline
version: 1

gates:
  - id: no_unapproved_canon_write
    rule: 任何写入 01_Canon/ 的操作必须附作者批准记录
    on_fail: 阻塞

  - id: source_required
    rule: 每条新增事实必须带来源（章节编号 / 作者原话 / 导入定位）
    on_fail: 阻塞

  - id: no_scope_escape
    rule: 写入路径必须落在任务声明的 output_scope 内
    on_fail: 阻塞

  - id: index_rebuildable
    rule: 删除 runtime/index 后必须能完整重建，且不影响事实源
    on_fail: 阻塞

  - id: draft_not_canon
    rule: 03_Manuscripts/Drafts 与 Revisions 中的内容不得被当作事实引用
    on_fail: 阻塞

  - id: signoff_binds_content
    rule: 连续性签字绑定正文 sha256；正文改动即失效，需重签
    on_fail: 阻塞

  - id: conflict_reported
    rule: 发现设定冲突时必须单列报告，不得静默择一
    on_fail: 阻塞

  - id: backup_before_destructive
    rule: 破坏性操作前必须有可用备份与回滚命令
    on_fail: 阻塞
```
