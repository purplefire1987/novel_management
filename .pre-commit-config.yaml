# 本地提交前检查。
# 安装：pip install pre-commit && pre-commit install
# 目的：把「隐私泄露」和「越界写入」两类事故挡在提交之前。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: forbid-submodules
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # 本仓库自己的隐私扫描：私人目录名、本机绝对路径、凭据模式、二进制与备份。
  # 只用标准库，不需要额外安装。
  - repo: local
    hooks:
      - id: privacy-scan
        name: privacy scan (public repo boundary)
        entry: python3 scripts/privacy_scan.py --repo .
        language: system
        pass_filenames: false
        always_run: true
